<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" 
    href="stylr.css">
</head>
<body>
    <header>
        <h1>studyhub dashbord</h1> 
        <section class="hero">
        <p>add search and manage student records.</p>
        <button onclick="showmessage()">get started</button>
    </section>
        </header>
        <section class="form-section"> 
            <h2>add student</h2>
            <input type="text" id="name"
            placeholder="Enter Student Name"> 
            <input type="number" id="age"
            placeholder="Enter Age">
            <input type="text" id="course" 
            placeholder="Enter course">

            <button onclick="addStudent()">addstudent</button>
            <button onclick="clearForm()">clear</button>

        </section>
        <section class="student-list">

    <h2>Student Records</h2>
    <input type="text" id="search" placeholder="Search Student">
    <button onclick="searchStudent()">Search</button>
    <h3 id="totalStudents">Total Students: 0</h3>
    <div id="studentContainer"></div>

</section>


            
</body>
<script src="index.js"></script>
</html>
